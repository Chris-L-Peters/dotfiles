# General
#||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||
if-shell 'infocmp tmux-256color > /dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'

if-shell '[ "$TERM_PROGRAM" != "Apple_Terminal" ]' \
    'set -as terminal-features ",*:RGB"'

if-shell '[ -x /usr/bin/zsh ]' 'set -g default-shell /usr/bin/zsh'
if-shell '[ -x /bin/zsh ]' 'set -g default-shell /bin/zsh'

set -g mouse on
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on
set -g detach-on-destroy off
set -s escape-time 10
set -g display-time 2000

# Navigation
#||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||
# Prefix Key
set-option -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# Splits
bind-key '\' split-window -h -c "#{pane_current_path}"
bind-key |   split-window -h -c "#{pane_current_path}"
bind-key -   split-window -v -c "#{pane_current_path}"
bind-key c   new-window      -c "#{pane_current_path}"

# Vim keys
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Resize
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Windows
#||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#S / #W"

# reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded.."

# Copy Paste
#||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy > /dev/null 2>&1' \
    'set -g @copy-command "wl-copy"'
if-shell '[ -z "$WAYLAND_DISPLAY" ] && [ -n "$DISPLAY" ] && command -v xclip > /dev/null 2>&1' \
    'set -g @copy-command "xclip -selection clipboard -in"'
if-shell 'command -v pbcopy > /dev/null 2>&1' \
    'set -g @copy-command "pbcopy"'

bind-key -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel "#{@copy-command}"
bind-key -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel "#{@copy-command}"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy-command}"
bind-key p paste-buffer

# Appearance
#||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||
bind-key t set-option status

set -g status-position top
set -g status-interval 5
set -g status-justify centre
